; Firmware-ul consolei Chronos — Raspberry Pi Pico (RP2040), core-ul Arduino al lui Earle Philhower.
;
; Încărcare (VS Code + extensia PlatformIO, sau din terminal):
;     cd console/firmware
;     pio run -t upload        ; prima dată: ține BOOTSEL apăsat când bagi cablul USB
;
; Logica (lib/logic) se testează pe PC, fără Pico:
;     g++ -std=c++17 -Ilib/logic test/native/logic_test.cpp lib/logic/*.cpp -o logic_test && ./logic_test

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags =
    -O2
    -DCONSOLE_FW=\"0.1\"
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit NeoPixel@1.12.3
monitor_speed = 115200
test_ignore = native
